<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">RAG system map</title>
<desc id="desc">Two stages: offline document ingestion and online question answering. Ingestion creates chunks and embeddings in a vector index. At query time retrieval and optional reranking supply context to a model, which returns an answer with citations or abstains.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111827"/><stop offset="1" stop-color="#1E1B4B"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#A5B4FC" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="650" rx="32" fill="url(#bg)"/>
<text x="60" y="72" fill="#F8FAFC" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700">RAG: TWO PIPELINES, TWO EVALUATIONS</text>
<g font-family="Inter,Arial,sans-serif">
 <text x="70" y="132" fill="#A5B4FC" font-size="18" font-weight="700">OFFLINE · INGESTION</text>
 <g transform="translate(70 160)"><rect width="190" height="95" rx="16" fill="#312E81" stroke="#818CF8"/><text x="95" y="42" fill="#EEF2FF" font-size="18" text-anchor="middle" font-weight="700">Documents</text><text x="95" y="68" fill="#C7D2FE" font-size="14" text-anchor="middle">source material</text></g>
 <g transform="translate(335 160)"><rect width="190" height="95" rx="16" fill="#312E81" stroke="#818CF8"/><text x="95" y="42" fill="#EEF2FF" font-size="18" text-anchor="middle" font-weight="700">Chunking</text><text x="95" y="68" fill="#C7D2FE" font-size="14" text-anchor="middle">preserve context</text></g>
 <g transform="translate(600 160)"><rect width="190" height="95" rx="16" fill="#312E81" stroke="#818CF8"/><text x="95" y="42" fill="#EEF2FF" font-size="18" text-anchor="middle" font-weight="700">Embeddings</text><text x="95" y="68" fill="#C7D2FE" font-size="14" text-anchor="middle">vectorise chunks</text></g>
 <g transform="translate(865 160)"><rect width="250" height="95" rx="16" fill="#164E63" stroke="#22D3EE"/><text x="125" y="42" fill="#CFFAFE" font-size="18" text-anchor="middle" font-weight="700">Vector index</text><text x="125" y="68" fill="#A5F3FC" font-size="14" text-anchor="middle">vectors + metadata</text></g>
 <g stroke="#A5B4FC" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M260 208 H327"/><path d="M525 208 H592"/><path d="M790 208 H857"/></g>
 <path d="M990 255 V330" stroke="#22D3EE" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
 <text x="70" y="365" fill="#5EEAD4" font-size="18" font-weight="700">ONLINE · QUESTION ANSWERING</text>
 <g transform="translate(70 395)"><rect width="180" height="100" rx="16" fill="#134E4A" stroke="#2DD4BF"/><text x="90" y="43" fill="#CCFBF1" font-size="18" text-anchor="middle" font-weight="700">Question</text><text x="90" y="70" fill="#99F6E4" font-size="14" text-anchor="middle">user query</text></g>
 <g transform="translate(310 395)"><rect width="180" height="100" rx="16" fill="#134E4A" stroke="#2DD4BF"/><text x="90" y="43" fill="#CCFBF1" font-size="18" text-anchor="middle" font-weight="700">Retrieve</text><text x="90" y="70" fill="#99F6E4" font-size="14" text-anchor="middle">top-k chunks</text></g>
 <g transform="translate(550 395)"><rect width="180" height="100" rx="16" fill="#134E4A" stroke="#2DD4BF"/><text x="90" y="43" fill="#CCFBF1" font-size="18" text-anchor="middle" font-weight="700">Rerank</text><text x="90" y="70" fill="#99F6E4" font-size="14" text-anchor="middle">optional stage</text></g>
 <g transform="translate(790 395)"><rect width="180" height="100" rx="16" fill="#164E63" stroke="#22D3EE"/><text x="90" y="43" fill="#CFFAFE" font-size="18" text-anchor="middle" font-weight="700">Generate</text><text x="90" y="70" fill="#A5F3FC" font-size="14" text-anchor="middle">grounded answer</text></g>
 <g transform="translate(1030 395)"><rect width="130" height="100" rx="16" fill="#14532D" stroke="#4ADE80"/><text x="65" y="43" fill="#DCFCE7" font-size="17" text-anchor="middle" font-weight="700">Cite /</text><text x="65" y="68" fill="#DCFCE7" font-size="17" text-anchor="middle" font-weight="700">abstain</text></g>
 <g stroke="#5EEAD4" stroke-width="2.5" fill="none" marker-end="url(#arrow)"><path d="M250 445 H302"/><path d="M490 445 H542"/><path d="M730 445 H782"/><path d="M970 445 H1022"/></g>
</g>
<text x="600" y="565" text-anchor="middle" fill="#E2E8F0" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Evaluate retrieval recall separately from answer faithfulness.</text>
<text x="600" y="600" text-anchor="middle" fill="#94A3B8" font-family="Inter,Arial,sans-serif" font-size="14">Good prose cannot repair missing evidence upstream.</text>
</svg>
