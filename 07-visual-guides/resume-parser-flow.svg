<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">Resume parser data flow</title>
<desc id="desc">A safe document AI pipeline from upload through file validation, PDF extraction, structured model output, schema validation, human review, and persistence.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#1E293B"/></linearGradient><marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10" fill="none" stroke="#94A3B8" stroke-width="1.6"/></marker></defs>
<rect width="1200" height="560" rx="32" fill="url(#bg)"/>
<text x="55" y="70" fill="#F8FAFC" font-family="Inter,Arial,sans-serif" font-size="32" font-weight="700">DOCUMENT AI: RESUME PARSER</text>
<text x="55" y="105" fill="#94A3B8" font-family="Inter,Arial,sans-serif" font-size="16">Design reference — validate each boundary in the actual application.</text>
<g font-family="Inter,Arial,sans-serif" text-anchor="middle">
 <g transform="translate(45 205)"><rect width="140" height="120" rx="16" fill="#1E3A8A" stroke="#60A5FA"/><text x="70" y="48" fill="#DBEAFE" font-size="17" font-weight="700">PDF</text><text x="70" y="76" fill="#BFDBFE" font-size="14">Upload</text></g>
 <g transform="translate(220 205)"><rect width="140" height="120" rx="16" fill="#1E3A8A" stroke="#60A5FA"/><text x="70" y="48" fill="#DBEAFE" font-size="16" font-weight="700">Validate</text><text x="70" y="76" fill="#BFDBFE" font-size="14">type + size</text></g>
 <g transform="translate(395 205)"><rect width="140" height="120" rx="16" fill="#164E63" stroke="#22D3EE"/><text x="70" y="48" fill="#CFFAFE" font-size="16" font-weight="700">Extract</text><text x="70" y="76" fill="#A5F3FC" font-size="14">PDF text</text></g>
 <g transform="translate(570 205)"><rect width="140" height="120" rx="16" fill="#164E63" stroke="#22D3EE"/><text x="70" y="48" fill="#CFFAFE" font-size="16" font-weight="700">Structure</text><text x="70" y="76" fill="#A5F3FC" font-size="14">LLM output</text></g>
 <g transform="translate(745 205)"><rect width="140" height="120" rx="16" fill="#134E4A" stroke="#2DD4BF"/><text x="70" y="48" fill="#CCFBF1" font-size="16" font-weight="700">Validate</text><text x="70" y="76" fill="#99F6E4" font-size="14">schema + rules</text></g>
 <g transform="translate(920 205)"><rect width="140" height="120" rx="16" fill="#134E4A" stroke="#2DD4BF"/><text x="70" y="48" fill="#CCFBF1" font-size="16" font-weight="700">Review</text><text x="70" y="76" fill="#99F6E4" font-size="14">human edit</text></g>
 <g transform="translate(1090 205)"><rect width="90" height="120" rx="16" fill="#14532D" stroke="#4ADE80"/><text x="45" y="48" fill="#DCFCE7" font-size="15" font-weight="700">DB</text><text x="45" y="76" fill="#BBF7D0" font-size="13">Save</text></g>
</g>
<g stroke="#94A3B8" stroke-width="2.5" fill="none" marker-end="url(#ar)"><path d="M185 265 H212"/><path d="M360 265 H387"/><path d="M535 265 H562"/><path d="M710 265 H737"/><path d="M885 265 H912"/><path d="M1060 265 H1082"/></g>
<rect x="395" y="385" width="490" height="72" rx="14" fill="#3F1D2E" stroke="#FB7185"/>
<text x="640" y="415" text-anchor="middle" fill="#FFE4E6" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700">Failure path: reject / retry safely / ask for correction</text>
<text x="640" y="439" text-anchor="middle" fill="#FECDD3" font-family="Inter,Arial,sans-serif" font-size="13">Never persist malformed or unreviewed values as trusted facts.</text>
</svg>
